# OrbitGuard | ASTRA 2026 | Team AstroNex
name: Update satellite data

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours
  workflow_dispatch:          # allow manual runs from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download TLEs from CelesTrak
        env:
          TLE_MIRROR_URL: https://raw.githubusercontent.com/${{ github.repository }}/tle-data
        run: python scripts/update_tle.py out

      - name: Publish to tle-data branch (single commit, no history growth)
        run: |
          cd out
          echo '{"git": {"deploymentEnabled": false}}' > vercel.json
          date -u +"%Y-%m-%dT%H:%M:%SZ" > updated.txt
          git init -q -b tle-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "TLE update $(cat updated.txt)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" tle-data
