<!doctype html>
<!-- OrbitGuard | ASTRA 2026 | Team AstroNex -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ code }} · {{ title }} · OrbitGuard</title>
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/orbitguard.css') }}">
<style>
  body { display: grid; place-items: center; min-height: 100vh; padding: 24px 16px; text-align: center; }
  .lost { position: relative; max-width: 620px; width: 100%; }
  .scene { position: relative; width: min(340px, 80vw); aspect-ratio: 1; margin: 0 auto 6px; }
  .planet { position: absolute; inset: 28%; border-radius: 50%;
            background: radial-gradient(circle at 35% 30%, #7cc4ff, #2f6fe0 45%, #0b2a6b 75%);
            box-shadow: 0 0 60px rgba(229,9,20,.45), inset -18px -14px 40px rgba(0,0,0,.55); }
  .orbit { position: absolute; inset: 6%; border-radius: 50%; border: 1.5px dashed rgba(255,255,255,.22); transform: rotateX(68deg) rotateZ(-20deg); }
  .drift { position: absolute; left: 50%; top: 50%; width: 0; height: 0; animation: drift 9s ease-in-out infinite; }
  .drift svg { max-width: none; width: 74px; height: 74px; transform: translate(-50%, -50%); color: #ffffff; filter: drop-shadow(0 0 10px rgba(229,9,20,.7)); animation: tumble 12s linear infinite; }
  @keyframes drift { 0% { transform: translate(70px, -120px); } 50% { transform: translate(120px, -60px); } 100% { transform: translate(70px, -120px); } }
  @keyframes tumble { to { transform: translate(-50%, -50%) rotate(360deg); } }
  .signal { position: absolute; left: 50%; top: 50%; width: 10px; height: 10px; border-radius: 50%; transform: translate(-50%, -50%);
            border: 2px solid rgba(255,92,114,.7); animation: lostsig 2.4s ease-out infinite; }
  .signal:nth-child(2) { animation-delay: .8s; } .signal:nth-child(3) { animation-delay: 1.6s; }
  @keyframes lostsig { to { width: 260px; height: 260px; opacity: 0; } }
  .code { font: 800 clamp(64px, 16vw, 120px)/1 var(--sans); letter-spacing: -.05em; margin: 0;
          background: linear-gradient(90deg, #fff, #ff8a8f 40%, #e50914 70%, #fff); background-size: 200% auto;
          -webkit-background-clip: text; background-clip: text; color: transparent; animation: shine 6s linear infinite; }
  @keyframes shine { to { background-position: 200% center; } }
  h1 { margin: 6px 0 8px; font-size: clamp(22px, 4vw, 30px); letter-spacing: -.02em; }
  p.lead { color: var(--muted); margin: 0 auto 6px; max-width: 460px; }
  .path { display: inline-block; font: 500 12px var(--mono); color: var(--dim); background: rgba(255,255,255,.04); border: 1px solid var(--line);
          border-radius: 99px; padding: 4px 12px; margin: 10px 0 22px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .btns { justify-content: center; }
  .telemetry { margin: 28px auto 0; display: inline-flex; gap: 18px; flex-wrap: wrap; justify-content: center; font: 500 11px var(--mono); color: var(--dim); }
  .telemetry b { color: var(--bad); font-weight: 500; }
</style>
</head>
<body>
<div class="bg" aria-hidden="true">
  <svg viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
    <ellipse class="arc" cx="1250" cy="880" rx="900" ry="380" transform="rotate(-14 1250 880)"/>
    <ellipse class="arc b" cx="1250" cy="880" rx="700" ry="270" transform="rotate(-14 1250 880)"/>
    <path class="arc" d="M-50 220 C 400 60, 900 40, 1650 260"/>
  </svg>
</div>
<main class="lost">
  <div class="scene" aria-hidden="true">
    <div class="orbit"></div>
    <div class="planet"></div>
    <div class="drift"><span class="signal"></span><span class="signal"></span><span class="signal"></span>
      <svg viewBox="0 0 120 120" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round">
        <rect x="48" y="44" width="24" height="32" rx="4"/><path d="M60 44V30M54 30h12"/><circle cx="60" cy="27" r="3"/>
        <path d="M48 52H14v16h34M72 52h34v16H72"/><path d="M54 76l-4 10h20l-4-10"/></svg></div>
  </div>
  <p class="code">{{ code }}</p>
  <h1>{{ title }}</h1>
  <p class="lead">{{ text }}</p>
  <span class="path" title="{{ path }}">{{ path }}</span>
  <div class="btns">
    <a class="btn" href="/"><svg class="ic" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>Back to Mission Control</a>
    <a class="btn ghost" href="/#satellites"><svg class="ic" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>Find a satellite</a>
    {% if code >= 500 %}<button class="btn ghost" onclick="location.reload()"><svg class="ic" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.64-6.36L21 8"/><path d="M21 3v5h-5"/></svg>Try again</button>{% endif %}
  </div>
  <div class="telemetry"><span>STATUS <b>{{ 'NO SIGNAL' if code == 404 else 'ANOMALY' }}</b></span><span>ERROR {{ code }}</span><span id="t">UTC --</span></div>
</main>
<script>
  const t = document.getElementById("t");
  const tick = () => t.textContent = "UTC " + new Date().toISOString().slice(11, 19);
  tick(); setInterval(tick, 1000);
</script>
</body>
</html>
